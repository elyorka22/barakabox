events {}

http {
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:4000;
    }

    server {
        listen 80;
        server_name chust-online-bozor.uz www.chust-online-bozor.uz;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name chust-online-bozor.uz www.chust-online-bozor.uz;

        ssl_certificate /etc/letsencrypt/live/chust-online-bozor.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chust-online-bozor.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://backend_upstream/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
