events {}

http {
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:4000;
    }

    server {
        listen 80;
        server_name chust-online-bozor.uz www.chust-online-bozor.uz;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name chust-online-bozor.uz www.chust-online-bozor.uz;

        ssl_certificate /etc/letsencrypt/live/chust-online-bozor.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chust-online-bozor.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            proxy_pass http://backend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
