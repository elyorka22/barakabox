version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barakabox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/barakabox
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-12345}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DELIVERY_FEE: 3000
      FREE_DELIVERY_THRESHOLD: 30000
      ORDER_IDEMPOTENCY_WINDOW_SECONDS: 120
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:?SPACES_ENDPOINT is required}
      SPACES_REGION: ${SPACES_REGION:?SPACES_REGION is required}
      SPACES_BUCKET: ${SPACES_BUCKET:?SPACES_BUCKET is required}
      SPACES_KEY: ${SPACES_KEY:?SPACES_KEY is required}
      SPACES_SECRET: ${SPACES_SECRET:?SPACES_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
